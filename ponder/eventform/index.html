<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Ticket</title>

  <!-- Built-in favicon so you do not need a separate favicon file -->
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23bfd0dc'/%3E%3Ctext x='32' y='43' font-size='38' text-anchor='middle'%3E🎟%3C/text%3E%3C/svg%3E"
  />

  <link rel="stylesheet" href="index.css" />
  <script src="index.js" defer></script>
</head>
<body>
  <main class="wrapper">
    <h1>Event Ticket</h1>

    <form id="eventForm" novalidate>
      <div class="field">
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" />
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" />
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" />
      </div>

      <div class="field">
        <label for="type">Type</label>
        <select id="type" name="type">
          <option value="">Choose one</option>
          <option value="student">Student</option>
          <option value="guest">Guest</option>
        </select>
      </div>

      <div class="field">
        <label for="eventDate">Event Date</label>
        <input id="eventDate" name="eventDate" type="date" />
      </div>

      <div id="extraField" class="field full" hidden>
        <label id="extraLabel" for="extraInput">Student I#</label>
        <input id="extraInput" name="extraInput" type="text" />
      </div>

      <button class="full" type="submit">Create Ticket</button>
    </form>

    <section id="messages" aria-live="polite"></section>
  </main>
</body>
</html>
