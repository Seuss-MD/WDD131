<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paste to Plate | Recipe Book</title>
    <link rel="stylesheet" href="styles/recipe-book.css">
    <link rel="stylesheet" href="styles/master.css">

    <script src="script/recipe-book.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <img class="img-logo" src="img/logo.png" alt="Paste to Plate logo">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="recipe-book.html">Recipe Book</a></li>
            </ul>
        </nav>
    </header>
    <main>    

        <!-- Hero Section -->
        <section class="hero">
            <img class="img-hero" src="img/recipe-book.jpg" alt="Hero image of recipe book">
            <p class="hero-text"> Load a CSV file into the recipe book.</p>
        </section>
        
        <!-- Upload  Existing CSV -->
        <section class="load">
            <button type="button" class="btn-load">Load Recipe Book</button>
            <input type="file" id="csv-file" accept=".csv,text/csv" hidden>
            <p id="load-message" role="status" aria-live="polite"></p>
        </section>

        <!-- Recipe search modal -->
        <dialog class="search-modal" id="search-modal">
            <div class="search-modal-heading">
                <h2>Search Recipes</h2>
                <button type="button" class="btn-close-search" aria-label="Close search">&times;</button>
            </div>
            <div class="search-bar">
                <label for="search-terms">Search by:</label>
                <select name="search-terms" id="search-terms">
                    <option value="title">Name</option>
                    <option value="category">Category</option>
                    <option value="directions">Directions</option>
                </select>
                <input type="search" name="search" id="search" placeholder="Type to search">
            </div>
        </dialog>

        <button type="button" class="btn-search" aria-label="Open recipe search">
            <img class="img--search" src="img/search-icon.png" alt="">
        </button>
        
        <!-- Recipe Book -->
        <h2 class="recipe-book-heading">Recipe Book</h2>
        <section class="recipe-book">
            <h3>No Recipes Found</h3>
        <!-- dynamic content -->
        </section>


    </main>

    <footer>

    </footer>
    
</body>
</html>
